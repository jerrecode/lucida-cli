name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v4
        with:
          repository: jerrecode/lucida-api
          path: api-dependency
      - run: python -m pip install -e api-dependency
      - run: python -m pip install pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Linux source installer smoke
        if: runner.os == 'Linux'
        run: LUCIDA_API_SOURCE=api-dependency bash ./install.sh
      - name: Windows PowerShell installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LUCIDA_API_SOURCE = (Resolve-Path api-dependency).Path
          .\install.ps1

